<div class="container">
    <div>
        <h2>Modifier un Jeu :</h2>
    </div>
    <form>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>ID jeu</label>
            <input readonly type="text" [(ngModel)]="currentJeu.idjeu" name="idjeu" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Jeu</label>
            <input type="text" [(ngModel)]="currentJeu.nomjeu" name="nomjeu" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Prix Jeu</label>
            <input type="number" [(ngModel)]="currentJeu.prixjeu" name="prixjeu" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date création</label>
            <input type="date" [ngModel]="currentJeu.dateCreation | date: ('dd/MM/yyyy')"(ngModelChange)=" currentJeu.dateCreation= $event" name="dateCreation" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Categorie</label>
        <select class="form-control form-control-lg" id="idCat" name="idCat" [(ngModel)]="updateCatid">
            @for(cat of categories; track cat.idCat)
            {
            <option [value]="cat.idCat"> {{cat.nomCat}} </option>
            }
        </select>
        </div>


        <div class="mt-2">
            <button type="submit" (click)="updateJeu()" class="btn btn-success">Modifer</button>
        </div>
    </form>
</div>
